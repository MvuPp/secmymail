<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecMyMail - Gestionnaire des balises</title>
    <link rel="stylesheet" href="../styles/balise.css">
    <script defer src="../scripts/common.js"></script>
    <script defer src="../scripts/balise.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <div class="menu-icon">
                <button id="menu-btn">
                    <img src="../assets/menu-icon.png" alt="Menu">
                </button>
            </div>
            <h1>SecMyMail</h1>
            <div class="logo" link="popup.html">
                <img src="../assets/logo.png" alt="SecMyMail Logo">
            </div>
        </header>

        <main>
            <h2>Gestionnaire des balises</h2>
            <button class="button">Fichier</button>
            <div class="list-container" id="fichier-list">
                <div class="list-item"><span> <button class="radioButton"></button></span>Fichier <span><input type="color" class="color-input" name="secmymail.contained_files"></span> </div>
            </div>

            <button class="button">Mail</button>
            <div class="list-container" id="mail-list">
                <div class="list-item"><span> <button class="radioButton" ></button> </span>Mail - Connu <span><input type="color" class="color-input" name="secmymail.verified_sender"></span></div>
                <div class="list-item"><span> <button class="radioButton" ></button> </span>Mail - Inconnu <span><input type="color" class="color-input" name="secmymail.unverified_sender"></span></div>
                <div class="list-item"><span> <button class="radioButton" ></button> </span>Mail - Connu blacklist <span><input type="color" class="color-input" name="secmymail.malicious_sender"></span></div>
            </div>

            <button class="button">Domaine</button>
            <div class="list-container" id="domaine-list">
                <div class="list-item"><span> <button class="radioButton" ></button> </span>Domaine - Connu <span><input type="color" class="color-input" name="secmymail.verified_link"></span></div>
                <div class="list-item"><span> <button class="radioButton" ></button> </span>Domaine - Inconnu <span><input type="color" class="color-input" name="secmymail.unverified_link"></span></div>
                <div class="list-item"><span> <button class="radioButton" ></button> </span>Domaine - Connu blacklist <span><input type="color" class="color-input" name="secmymail.malicious_link"></span></div>
            </div>
        </main>
        <footer>
            <p>Par : MailArmor</p>
        </footer>
    </div>
</body>
</html>
