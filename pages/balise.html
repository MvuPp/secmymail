<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecMyMail - Gestionnaire des balises</title>
    <link rel="stylesheet" href="../styles/balise.css">
    <script defer src="../scripts/common.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <div class="menu-icon">
                <button id="menu-btn">
                    <img src="../assets/menu-icon.png" alt="Menu">
                </button>
            </div>
            <h1>SecMyMail</h1>
            <div class="logo" link="popup.html">
                <img src="../assets/logo.png" alt="SecMyMail Logo">
            </div>
        </header>

        <main>
            <h2>Gestionnaire des balises</h2>
            <button class="button" onclick="toggleList('fichier')">Fichier</button>
            <div class="list-container" id="fichier-list">
                <div class="list-item">Fichier</div>
            </div>

            <button class="button" onclick="toggleList('mail')">Mail</button>
            <div class="list-container" id="mail-list">
                <div class="list-item"><span> <button class="radioButton" id="buttonMailListe" value="secmymail.verified_sender"></button> </span>Mail - Connu <span class="status known"></span></div>
                <div class="list-item"><span> <button class="radioButton" id="buttonMailListe" value="secmymail.unverified_sender"></button> </span>Mail - Inconnu <span class="status unknown"></span></div>
                <div class="list-item"><span> <button class="radioButton" id="buttonMailListe" value="secmymail.malicious_sender"></button> </span>Mail - Connu blacklist <span class="status blacklist"></span></div>
            </div>

            <button class="button" onclick="toggleList('domaine')">Domaine</button>
            <div class="list-container" id="domaine-list">
                <div class="list-item"><span> <button class="radioButton" id="buttonMailListe" value="secmymail.verified_link"></button> </span>Domaine - Connu <span class="status known"></span></div>
                <div class="list-item"><span> <button class="radioButton" id="buttonMailListe" value="secmymail.unverified_link"></button> </span>Domaine - Inconnu <span class="status unknown"></span></div>
                <div class="list-item"><span> <button class="radioButton" id="buttonMailListe" value="secmymail.malicious_link"></button> </span>Domaine - Connu blacklist <span class="status blacklist"></span></div>
            </div>
        </main>
        <footer>
            <p>Par : MailArmor</p>
        </footer>
    </div>
    <script defer src="../scripts/balise.js"></script>
</body>
</html>
