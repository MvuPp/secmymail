<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecMyMail</title>
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/popup.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <img src="../assets/logo.png" alt="SecMyMail Logo">
            </div>
            <h1>SecMyMail</h1>
        </header>

        <main class="main-content">
            <div class="menu-grid">
                <a href="lists.html" class="menu-button" data-action="lists">
                    <div class="button-icon">📋</div>
                    <div class="button-text">
                        <h3>Listes de contrôle</h3>
                        <p>Gérer les listes blanches et noires</p>
                    </div>
                </a>

                <a href="tags.html" class="menu-button" data-action="tags">
                    <div class="button-icon">🏷️</div>
                    <div class="button-text">
                        <h3>Gestion des tags</h3>
                        <p>Configurer les tags et le déplacement</p>
                    </div>
                </a>

                <!-- Ajoute ceci dans la div .menu-grid de popup.html -->
                <a href="logs.html" class="menu-button" data-action="logs">
                    <div class="button-icon">📝</div>
                    <div class="button-text">
                        <h3>Journalisation</h3>
                        <p>Voir et exporter les logs</p>
                    </div>
                </a>
        </main>

        <footer class="footer">
            <p>Par : MailArmor</p>
        </footer>
    </div>

    <script src="../scripts/ui/popup.js"></script>
</body>
</html>
