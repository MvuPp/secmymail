<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecMyMail</title>
    <link rel="stylesheet" href="../styles/popup.css">
    <script defer src="../scripts/common.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo" >
                <img src="../assets/logo.png" alt="SecMyMail Logo">
            </div>
            <h1>SecMyMail</h1>
        </header>
        <main>
            <div>
                <button class="button" link="domain-whitelist.html" popup width="600" height="800">Domaines de confiance</button>
            </div>
            <div>
                <button class="button" link="email-whitelist.html" popup width="600" height="800">Adresses de confiance</button>
            </div>
            <div>
                <button class="button" link="domain-blacklist.html" popup width="600" height="800">Domaines malveillants</button>
            </div>
            <div>
                <button class="button" link="email-blacklist.html" popup width="600" height="800">Adresses malveillantes</button>
            </div>
            <div>
                <!--
                    Ouvrir une autre fenêtre est le seul moyen pour que le changement de couleur prenne effet
                    C'est à cause de ce bug de Firefox/Thunderbird :
                    https://bugzilla.mozilla.org/show_bug.cgi?id=1378527
                -->
                <button class="button" link="tags.html" popup width="400" height="600">Tags</button>
            </div>
        </main>

        <footer>
            <p>Par : MailArmor</p>
        </footer>
    </div>

</html>
