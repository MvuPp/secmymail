stages:
  - build
  - release

variables:
  PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/secmymail/${CI_COMMIT_TAG}"

build:
  stage: build
  image: alpine:latest
  before_script:
    - apk add --no-cache zip bash
  script:
    - chmod +x build.sh
    - ./build.sh
  artifacts:
    paths:
      - build/secmymail.xpi
    expire_in: never
  only:
    - tags
    - main

upload:
  stage: release
  image: curlimages/curl:latest
  needs:
    - build
  script:
    - |
      curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file build/secmymail.xpi "${PACKAGE_REGISTRY_URL}/secmymail.xpi"
  only:
    - tags

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - build
    - upload
  script:
    - echo "Creating release for tag ${CI_COMMIT_TAG}"
  release:
    tag_name: $CI_COMMIT_TAG
    name: 'Release $CI_COMMIT_TAG'
    description: 'SecMyMail Extension Release $CI_COMMIT_TAG'
    assets:
      links:
        - name: 'secmymail.xpi'
          url: '${PACKAGE_REGISTRY_URL}/secmymail.xpi'
          link_type: 'package'
  only:
    - tags