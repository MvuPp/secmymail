stages:
  - build
  - release

variables:
  PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/secmymail/${CI_COMMIT_TAG}"

build:
  stage: build
  image: alpine:latest
  before_script:
    - apk add --no-cache zip bash
  script:
    - chmod +x build.sh
    - ./build.sh
  artifacts:
    paths:
      - build/secmymail.xpi
    expire_in: never
  only:
    - main
    - develop

upload:
  stage: release
  image: curlimages/curl:latest
  needs:
    - build
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file build/secmymail.xpi "${PACKAGE_REGISTRY_URL}/secmymail.xpi"
      else
        curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file build/secmymail.xpi "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/secmymail/${CI_COMMIT_SHORT_SHA}/secmymail.xpi"
      fi
  only:
    - main
    - develop

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - build
    - upload
  script:
    - echo "Creating release for commit ${CI_COMMIT_SHORT_SHA}"
  release:
    tag_name: 'auto-${CI_COMMIT_SHORT_SHA}'
    name: 'Auto Release ${CI_COMMIT_SHORT_SHA}'
    description: 'SecMyMail Extension Auto Release from ${CI_COMMIT_REF_NAME} branch'
    assets:
      links:
        - name: 'secmymail.xpi'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/secmymail/${CI_COMMIT_SHORT_SHA}/secmymail.xpi'
          link_type: 'package'
  only:
    - main
    - develop